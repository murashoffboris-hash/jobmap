events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    upstream backend {
        server backend:8001;
    }

    upstream frontend {
        server frontend:80;
    }

    # ═══════════════════════════════════════════════════
    #  HTTPS server — SSL certs in /etc/nginx/certs/
    #  Для Let's Encrypt: certbot certonly --standalone
    #  (нужен корректный DNS A-запись → 104.237.11.110)
    # ═══════════════════════════════════════════════════
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name phone.service247.by api.phone.service247.by;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; frame-ancestors 'self';" always;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Own tileserver (self-hosted тайлы, Беларусь mbtiles) ──
        location = /tiles/style.json {
            proxy_pass http://tileserver:8080/styles/jobmap/style.json;
            proxy_set_header Host tileserver;
            expires 1h;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://tileserver:8080/' '/tiles/';
            sub_filter 'http://tileserver/' '/tiles/';
        }
        location /tiles/ {
            proxy_pass http://tileserver:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host phone.service247.by;
            expires 24h;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://phone.service247.by/' 'https://phone.service247.by/';
            sub_filter 'http://api.phone.service247.by/' 'https://phone.service247.by/';
            sub_filter '"http://' '"https://';
        }
        location /data/ {
            proxy_pass http://tileserver:8080/data/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host phone.service247.by;
            expires 24h;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://phone.service247.by/' 'https://phone.service247.by/';
            sub_filter 'http://api.phone.service247.by/' 'https://phone.service247.by/';
            sub_filter '"http://' '"https://';
        }
        location /fonts/ {
            proxy_pass https://tiles.basemaps.cartocdn.com/fonts/;
            proxy_set_header Host tiles.basemaps.cartocdn.com;
            proxy_ssl_server_name on;
            expires 24h;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://backend/health;
        }
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        server_name phone.service247.by api.phone.service247.by;
        return 301 https://$host$request_uri;
    }

    # ── Fallback: unmatched Host → HTTP (for IP access, health checks) ──
    server {
        listen 80 default_server;
        server_name _;

        # Security headers (same as HTTPS, minus HSTS)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; frame-ancestors 'self';" always;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Own tileserver (self-hosted тайлы, Беларусь mbtiles) ──
        location = /tiles/style.json {
            proxy_pass http://tileserver:8080/styles/jobmap/style.json;
            proxy_set_header Host tileserver;
            expires 1h;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://tileserver:8080/' '/tiles/';
            sub_filter 'http://tileserver/' '/tiles/';
        }
        location /tiles/ {
            proxy_pass http://tileserver:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host phone.service247.by;
            expires 24h;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://phone.service247.by/' 'https://phone.service247.by/';
            sub_filter 'http://api.phone.service247.by/' 'https://phone.service247.by/';
            sub_filter '"http://' '"https://';
        }
        location /data/ {
            proxy_pass http://tileserver:8080/data/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host phone.service247.by;
            expires 24h;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://phone.service247.by/' 'https://phone.service247.by/';
            sub_filter 'http://api.phone.service247.by/' 'https://phone.service247.by/';
            sub_filter '"http://' '"https://';
        }
        location /fonts/ {
            proxy_pass https://tiles.basemaps.cartocdn.com/fonts/;
            proxy_set_header Host tiles.basemaps.cartocdn.com;
            proxy_ssl_server_name on;
            expires 24h;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://backend/health;
        }

        location /internal/ {
            return 403;
        }
    }
}
