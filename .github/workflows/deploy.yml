# CI/CD: авто-деплой JobMap на VPS 104.237.11.110
# Триггер: push в main или ручной запуск (workflow_dispatch)
# Время от push до ready: ≤ 5 минут

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Пропустить тесты (быстрее, только билд и деплой)'
        type: boolean
        default: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PATH: /opt/jobmap

jobs:
  # ── Сборка и деплой ──
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Установка Node.js (для сборки фронтенда)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Сборка фронтенда
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build done — $(find dist -type f | wc -l) files"

      # 4. Проверка бэкенда (синтаксис Python)
      - name: Verify Backend
        run: |
          python -m compileall backend/app/ -q 2>&1 || {
            echo "::warning::Backend compile check had warnings (non-fatal)"
          }

      # 5. Копирование файлов на VPS (через SCP)
      - name: Copy Frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: frontend/dist/*
          target: ${{ env.VPS_PATH }}/frontend/dist/
          strip_components: 2
          rm: true
          overwrite: true

      - name: Copy Backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: backend/app/**
          target: ${{ env.VPS_PATH }}/backend/app/
          strip_components: 1
          rm: false
          overwrite: true

      # 6. Пересборка и рестарт на VPS
      - name: Rebuild & Restart on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/jobmap

            echo "=== Rebuilding backend ==="
            docker compose build --no-cache backend 2>&1 | tail -5

            echo "=== Restarting backend + frontend ==="
            docker compose up -d backend frontend 2>&1 | tail -3

            echo "=== Waiting for healthy ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
                echo "Backend healthy after ${i}s"
                break
              fi
              sleep 1
            done

            echo "=== Container status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E 'jobmap-backend|jobmap-frontend'

      # 7. Smoke-тест (через HTTPS)
      - name: Smoke Test
        run: |
          echo "=== Health check ==="
          curl -sk --max-time 10 https://phone.service247.by/health || {
            echo "::error::Health check FAILED"
            exit 1
          }

          echo "=== API vacancies check ==="
          RESPONSE=$(curl -sk --max-time 10 https://phone.service247.by/api/vacancies?page_size=1)
          echo "$RESPONSE" | head -c 300
          if echo "$RESPONSE" | grep -q '"items"'; then
            echo ""
            echo "Smoke test PASSED"
          else
            echo "::error::API smoke test FAILED — no items in response"
            exit 1
          fi

  # ── Откат (если deploy упал) ──
  rollback:
    name: Rollback (on failure)
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Rollback to previous commit on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/jobmap
            echo "=== Rolling back to HEAD~1 ==="
            git checkout HEAD~1
            docker compose build --no-cache backend 2>&1 | tail -3
            docker compose up -d backend frontend 2>&1 | tail -3
            echo "Rollback complete"
